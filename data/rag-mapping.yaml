# 베이스: index/notebooklm-mapping.yaml (Track A 28개)
# 목적: 외부 NotebookLM 노트북을 내부 GCP Discovery Engine 데이터 스토어와 매핑
#
# Schema:
#   notebook_name      : NotebookLM 화면에서 보이는 정확한 노트북 이름
#   project            : Wiki 프로젝트 폴더명 (영문 케밥)
#   display_name       : UI/텔레그램 노출용 한글 짧은 이름
#   category           : real-estate / system / trading / learning / legal /
#                        personal / research / business / health / mongolia
#   status             : active / paused / archived
#   data_store         : Track B Discovery Engine 데이터 스토어 ID (9개 그룹)
#   data_store_filter  : 스토어 안에서 해당 프로젝트만 필터링하는 메타데이터 표현식
#
# 선택 필드:
#   notebook_url       : NotebookLM 외부 링크 (회장님이 채움 — 채워진 카드만 외부 점프 활성)
#   notes              : 추가 메모
#   tags               : 검색용 태그 배열
#   created_at         : ISO 8601 (YYYY-MM-DD)
#
# 데이터 스토어 그룹핑 (9개):
#   ds-real-estate-deals      : 부동산 PF 11건
#   ds-trading-research       : 트레이딩·시스템 자동화 2건 (system 카테고리도 여기로 흡수)
#   ds-learning-ai            : 학습·AI 에이전트 6건
#   ds-research-macro         : 리서치·매크로 3건
#   ds-legal-contracts        : 법무·계약 1건
#   ds-business-operations    : 회사·사업 운영 1건
#   ds-mongolia-business      : 몽골 사업 1건
#   ds-personal-strategy      : 개인 전략·여행 2건
