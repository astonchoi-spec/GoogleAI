# NotebookLM 노트북 ↔ Aston-Wiki 프로젝트 매핑
#
# 본 파일의 운영 위치: Google Drive/Aston-Wiki/index/notebooklm-mapping.yaml
# (이 레포의 사본은 스켈레톤·템플릿 용도)
#
# 작성: 2026-05-07 (Phase A·B-0 확정 시점)
# 채우는 주체: 회장님 직접
# 사용처: NotebookLM 결과 회수 시 자동으로 올바른 projects/{project}/notebooklm/ 폴더 결정
#
# 채우는 방법:
#   1. 회장님이 운영 중인 NotebookLM 노트북 30개+ 목록 확인
#   2. 각 노트북에 대해 아래 schema에 맞춰 한 줄씩 추가
#   3. project 필드는 영문 케밥 케이스 (Q1 결정에 따름 — 확정 후 본 파일 적용)
#   4. display_name 필드에 한글명 그대로 보존
#
# Schema (각 항목당 필수 필드):
#   notebook_name : NotebookLM에서 보이는 노트북 이름 (한글 가능)
#   project       : 매핑되는 Wiki 프로젝트 폴더명 (영문 케밥)
#   display_name  : UI/텔레그램에 표시할 한글명
#   category      : 분류 (real-estate / system / trading / learning / legal / personal 등)
#   status        : active / paused / archived
#
# 선택 필드:
#   notes         : 추가 메모
#   tags          : 검색용 태그 배열
#   created_at    : ISO 8601 (YYYY-MM-DD)

notebooks: []

